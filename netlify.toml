# Netlify build for the Nuru Field frontend.
#
# The app is a single-page React build served from frontend/dist. Every route
# other than / exists only in the browser, so the host has to answer a direct
# request for /field or /login with index.html rather than its own 404.
#
# That rewrite is declared here rather than relying on frontend/public/_redirects:
# the deployed copy of that file was never applied, and the symptom was a Netlify
# "Page not found" on /login, /field and /scan for anyone who refreshed or opened
# a link — the app worked only when navigated to from inside itself.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 runs on rolldown, which imports node:util#styleText and therefore needs
  # Node 20+. Pinning it here keeps that decision with the repository instead of
  # with whatever version the host happens to default to.
  NODE_VERSION = "20"

# The three VITE_ variables are build-time inlining, not runtime configuration:
# changing them in the Netlify UI does nothing until the site is rebuilt.
#   VITE_SUPABASE_URL       Project settings -> API -> Project URL
#   VITE_SUPABASE_ANON_KEY  Project settings -> API -> anon / publishable key
#   VITE_API_BASE_URL       the Render URL, e.g. https://nuru-field-api.onrender.com

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Single-page app fallback. Status 200 (a rewrite, not a redirect) keeps the URL
# the visitor typed, which is what react-router expects to read.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
